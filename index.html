<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEBS JOEL // Diseño Web & Desarrollo</title>
<meta name="description" content="Webs Joel: diseño web y desarrollo profesional.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050705">
<link rel="icon" id="favicon" href="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--on:#0a1204;--ac:#a3e635;--ac2:#7fbf1f;--dark:#050705;--bg:#050705;--pn:#0b0f0b;--pn2:#101610;--ln:rgba(255,255,255,.09);--lna:color-mix(in srgb,var(--ac) 38%,transparent);--tx:#eef2ea;--mu:#98a493;--r:14px;--ease:cubic-bezier(.2,.7,.2,1)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px;-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--tx);background:var(--bg);overflow-x:hidden;line-height:1.5;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}button{font-family:inherit}
img{max-width:100%}
.wrap{width:min(1120px,100% - 40px);margin:auto}
h1,h2,h3,h4,.pr{font-family:'Space Grotesk',Inter,sans-serif;letter-spacing:-.02em}
.hl{color:var(--ac);display:block}
.ln .hl{display:inline}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ambiente */
.amb{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.amb:before,.amb:after{content:"";position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.16;background:radial-gradient(circle,var(--ac),transparent 65%);will-change:transform}
.amb:before{right:-25vmax;top:calc(5vh - var(--sy,0)*.12px)}
.amb:after{left:-30vmax;top:calc(70vh - var(--sy,0)*.2px);opacity:.1}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:56px 56px;opacity:.35;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 20%,#000,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 50% 20%,#000,transparent 75%)}
#prog{position:fixed;left:0;top:0;height:2px;width:100%;background:var(--ac);transform:scaleX(0);transform-origin:left;z-index:60;box-shadow:0 0 10px var(--ac)}
/* botones */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on);font-weight:600;font-size:.9rem;padding:12px 22px;border-radius:10px;border:0;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px -8px var(--ac)}
.btn:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .6s}
.btn:hover:after{left:130%}
.btn .i{transition:transform .25s}.btn:hover .i{transform:translateX(3px)}
.btn.s{padding:9px 16px;font-size:.82rem}
.btn.g{background:none;color:var(--tx);border:1px solid var(--ln)}.btn.g:hover{border-color:var(--lna);box-shadow:none}
.btn.off{opacity:.5}
/* menu */
.nav{position:sticky;top:0;z-index:50;background:rgba(5,7,5,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.nav .in{width:min(1120px,100% - 40px);margin:auto;height:58px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.br{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem;letter-spacing:.08em}
.br img{width:30px;height:30px;border-radius:8px;object-fit:cover}
.nav ul{list-style:none;display:flex;gap:2px;flex:1;justify-content:center}
.nav ul a{position:relative;display:block;padding:8px 14px;font-size:.86rem;font-weight:500;color:var(--mu);transition:color .2s}
.nav ul a:after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:1.5px;background:var(--ac);transform:scaleX(0);transition:transform .3s var(--ease)}
.nav ul a:hover,.nav ul a.on{color:#fff}.nav ul a.on:after,.nav ul a:hover:after{transform:scaleX(1)}
.mb{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--ln);background:transparent;cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.mb i{display:block;width:18px;height:1.5px;background:#fff;transition:.25s}
.nav.open .mb i:nth-child(1){transform:translateY(6.5px) rotate(45deg)}.nav.open .mb i:nth-child(2){opacity:0}.nav.open .mb i:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
/* banner (imagen original, sin texto) */
header#inicio{position:relative;overflow:hidden;background:var(--bg);aspect-ratio:16/6;max-height:64vh;width:100%}
header#inicio:after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(to bottom,transparent,var(--bg))}
#hi{display:block;width:100%;height:100%;object-fit:cover;object-position:center;animation:kb 2.4s var(--ease) both}
header#inicio:before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.1) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 2.2s .5s var(--ease) 1 forwards;pointer-events:none}
@keyframes kb{from{transform:scale(1.08);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes sheen{to{transform:translateX(120%)}}
/* secciones */
.sec{padding:64px 0 8px}
.sh{text-align:center;margin-bottom:30px}
.ey{display:inline-flex;align-items:center;gap:10px;font-size:.72rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);margin-bottom:12px}
.ey:before,.ey:after{content:"";width:22px;height:1px;background:var(--lna)}
.sh h2,.lead h1{font-size:clamp(1.7rem,3.8vw,2.5rem);font-weight:600;line-height:1.12;white-space:pre-line}
.sh p,.lead p.sub{color:var(--mu);max-width:640px;margin:12px auto 0;font-size:1rem;white-space:pre-line}
.rv{opacity:0;transform:translateY(20px);transition:opacity .8s var(--ease) var(--d,0s),transform .8s var(--ease) var(--d,0s)}
.rv.in{opacity:1;transform:none}
/* presentacion */
.lead{padding:44px 0 8px;text-align:center}
.lead h1{font-size:clamp(2rem,5.2vw,3.5rem);font-weight:700;line-height:1.06}
.lead h1 .ln{display:block;overflow:hidden;padding-bottom:.08em}
.lead h1 .ln>span{display:block;transform:translateY(105%);transition:transform 1s var(--ease) calc(.15s + var(--k,0)*.14s)}
.lead.in h1 .ln>span{transform:none}
.lead .cta{margin-top:26px}
.note{display:block;margin-top:14px;font-size:.8rem;color:var(--mu)}
#trg{display:grid;grid-template-columns:repeat(4,1fr);margin-top:36px;background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;text-align:left}
#trg .it{display:flex;gap:12px;align-items:flex-start;padding:18px 18px;border-right:1px solid var(--ln);transition:background .3s}
#trg .it:last-child{border:0}#trg .it:hover{background:rgba(255,255,255,.025)}
.ic{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--lna);background:color-mix(in srgb,var(--ac) 8%,transparent);color:var(--ac);font-size:1.1rem;flex:none;transition:transform .4s var(--ease),background .3s}
.it:hover .ic,.cd:hover .ic{transform:translateY(-2px) rotate(-6deg);background:color-mix(in srgb,var(--ac) 16%,transparent)}
#trg h3{font-size:.92rem;font-weight:600;line-height:1.25}#trg p{font-size:.8rem;color:var(--mu);margin-top:3px;line-height:1.45}
/* tarjetas */
.cds{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));text-align:left}
.cd{position:relative;overflow:hidden;padding:22px;border-radius:var(--r);background:var(--pn);border:1px solid var(--ln);transition:border-color .3s,transform .4s var(--ease)}
.cd:hover{border-color:var(--lna);transform:translateY(-3px)}
.sp:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--ac) 14%,transparent),transparent 60%)}
.sp:hover:before{opacity:1}
.cd .no{position:absolute;right:18px;top:14px;font-family:'Space Grotesk',sans-serif;font-size:.78rem;color:rgba(255,255,255,.22);letter-spacing:.1em}
.cd h3{font-size:1.05rem;font-weight:600;margin:16px 0 6px;position:relative}.cd p{font-size:.9rem;color:var(--mu);position:relative}
.cd .ic{position:relative}
/* planes */
.pl{display:grid;grid-template-columns:1.3fr 1fr;gap:26px;align-items:center}
.stage{position:relative;border-radius:var(--r);border:1px solid var(--ln);background:var(--pn);overflow:hidden;box-shadow:0 30px 70px -40px color-mix(in srgb,var(--ac) 45%,transparent)}
.stage .bar{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--ln);background:var(--pn2);position:relative;z-index:2}
.stage .bar i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.16)}
.stage .bar span{margin-left:10px;font-size:.7rem;color:var(--mu);letter-spacing:.04em}
.slw{position:relative;aspect-ratio:16/10;background:#070a07}
.sl{position:absolute;inset:0;opacity:0;transform:scale(1.04);transition:opacity .7s var(--ease),transform 1.1s var(--ease);pointer-events:none}
.sl.on{opacity:1;transform:none}
.sl img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.sl.fit img{object-fit:contain;object-position:center}
.slw:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 70%,rgba(5,7,5,.5))}
.pinf{display:grid}
.pi{grid-area:1/1;opacity:0;transform:translateX(18px);transition:opacity .5s var(--ease),transform .6s var(--ease);pointer-events:none;visibility:hidden}
.pi.on{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition-delay:.12s}
.bd{display:inline-block;font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);border:1px solid var(--lna);padding:4px 11px;border-radius:99px}
.pi h3{font-size:1.9rem;font-weight:600;margin:14px 0 4px;white-space:pre-line;line-height:1.1}
.pr{font-size:2.6rem;font-weight:700;color:var(--ac);line-height:1.1}
.pi p{color:var(--mu);margin:12px 0 20px;font-size:.95rem;white-space:pre-line}
.acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nv{display:flex;gap:8px;margin-top:22px;align-items:center;color:var(--mu);font-size:.8rem}
.nv button{width:38px;height:38px;border-radius:10px;border:1px solid var(--ln);background:transparent;color:var(--tx);cursor:pointer;display:grid;place-items:center;transition:.25s}
.nv button:hover{border-color:var(--lna);color:var(--ac)}
.cnt{margin-left:6px;font-family:'Space Grotesk',sans-serif;letter-spacing:.1em}
.ptabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:22px}
.tab{position:relative;overflow:hidden;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);cursor:pointer;transition:border-color .3s,background .3s,transform .3s var(--ease)}
.tab:hover{transform:translateY(-2px)}
.tab small{display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.tab b{display:flex;justify-content:space-between;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.95rem;margin-top:2px}.tab b span{color:var(--ac)}
.tab.on{border-color:var(--lna);background:var(--pn2)}
.tab .pg{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--ac);transform:scaleX(0);transform-origin:left}
.tab.on .pg{transform:scaleX(1)}
.auto .tab.on .pg{transform:scaleX(0);animation:fill 7s linear forwards}
#plw:hover .pg,#plw.off .pg{animation-play-state:paused}
@keyframes fill{to{transform:scaleX(1)}}
/* proceso */
.stp{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:left}
.stp:before{content:"";position:absolute;left:12%;right:12%;top:41px;height:1px;background:linear-gradient(90deg,var(--ac),var(--lna));transform:scaleX(0);transform-origin:left;transition:transform 1.4s var(--ease) .3s}
.stp.in:before{transform:scaleX(1)}
.stp .cd{text-align:center;padding:22px 20px}
.stp .n{display:grid;place-items:center;width:38px;height:38px;margin:0 auto;border-radius:50%;background:var(--ac);color:var(--on);font-family:'Space Grotesk',sans-serif;font-weight:700;position:relative;box-shadow:0 0 0 6px var(--bg),0 0 22px -4px var(--ac)}
/* trabajos */
.wks{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.wk{position:relative;border-radius:var(--r);overflow:hidden;background:var(--pn);border:1px solid var(--ln);cursor:zoom-in;transition:border-color .3s,transform .4s var(--ease);display:flex;flex-direction:column;text-align:left}
.wk:hover{border-color:var(--lna);transform:translateY(-4px)}
.wk .im{overflow:hidden;background:#070a07;aspect-ratio:16/10;display:grid;place-items:center}
.wk img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .8s var(--ease)}
.wk:hover img{transform:scale(1.04)}
.wk .bd2{padding:16px 18px 18px;position:relative}
.wk h4{font-size:1.05rem;font-weight:600}.wk p{font-size:.88rem;color:var(--mu);margin-top:4px}
.wk .lk{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:.82rem;font-weight:600;color:var(--ac)}
.lb{position:fixed;inset:0;background:rgba(3,5,3,.94);z-index:70;display:none;align-items:center;justify-content:center;padding:24px;flex-direction:column;gap:10px;text-align:center}
.lb.on{display:flex;animation:fd .3s}
@keyframes fd{from{opacity:0}}
.lb img{max-width:100%;max-height:74vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lb h3{font-size:1.3rem}.lb p{color:var(--mu);max-width:640px}
.lb button{position:absolute;top:16px;right:18px;width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:rgba(255,255,255,.08);color:#fff;font-size:1.1rem;cursor:pointer}
/* garantia */
.gbox{position:relative;overflow:hidden;display:flex;align-items:center;gap:26px;padding:30px 32px;border-radius:var(--r);background:linear-gradient(120deg,var(--pn),color-mix(in srgb,var(--ac) 9%,var(--pn)));border:1px solid var(--ln)}
.gem{display:grid;place-items:center;flex:none;width:76px;height:76px;aspect-ratio:1/1;border-radius:50%;border:1px solid var(--lna);color:var(--ac);font-size:2rem;background:color-mix(in srgb,var(--ac) 8%,transparent);animation:pl 3.4s ease-in-out infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 30%,transparent)}50%{box-shadow:0 0 0 14px transparent}}
.gbox h2{font-size:clamp(1.3rem,2.8vw,1.8rem);font-weight:600;line-height:1.15;text-align:left;white-space:pre-line}
.gbox p{margin:10px 0 18px;color:var(--mu);white-space:pre-line}
.gbox .hl{display:inline}
/* oferta */
.promo{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:30px;padding:38px 38px;border-radius:var(--r);border:1px solid var(--lna);background:radial-gradient(480px 260px at 95% 50%,color-mix(in srgb,var(--ac) 20%,transparent),transparent 70%),var(--pn)}
.promo>div{position:relative;max-width:600px}
.promo h5{font-size:.72rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.promo h5:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ac);animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.25}}
.promo h2{font-size:clamp(1.5rem,3.2vw,2.2rem);font-weight:600;line-height:1.1;margin-bottom:10px;white-space:pre-line}
.promo p{color:var(--mu);margin-bottom:18px;white-space:pre-line}
.sel{display:inline-block;margin-right:12px;background:rgba(255,255,255,.04);border:1px solid var(--ln);padding:11px 14px;border-radius:10px;margin-bottom:10px;vertical-align:middle;font-size:.88rem;color:#dfe7da}
.sel b{color:#fff}.sel .pr2{color:var(--ac)}.sel a{margin-left:10px;color:var(--ac);font-weight:600}.sel a.go{margin:0;color:inherit}
.sel.emp span{color:var(--ac)}
.sel.flash{animation:fl .9s}
@keyframes fl{30%{border-color:var(--ac);box-shadow:0 0 24px -6px var(--ac)}}
/* faq */
.faq{max-width:760px;margin:0 auto;text-align:left}
.fq{background:var(--pn);border:1px solid var(--ln);border-radius:12px;margin-bottom:8px;transition:border-color .3s}
.fq.on{border-color:var(--lna)}
.fq button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;background:none;border:0;color:#fff;font-weight:600;font-size:.96rem;text-align:left;cursor:pointer}
.fq button:after{content:"";width:9px;height:9px;border-right:1.5px solid var(--ac);border-bottom:1.5px solid var(--ac);transform:rotate(45deg) translateY(-2px);transition:transform .3s var(--ease);flex:none}
.fq.on button:after{transform:rotate(225deg)}
.fa{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.fq.on .fa{grid-template-rows:1fr}
.fa>div{overflow:hidden}.fa p{padding:0 18px 16px;color:var(--mu);font-size:.92rem;white-space:pre-line}
/* contacto */
.ctg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;max-width:720px;margin:0 auto;text-align:left}
.ct{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:var(--r);background:var(--pn);border:1px solid var(--ln);transition:border-color .3s,transform .4s var(--ease);min-width:0}
.ct:hover{border-color:var(--lna);transform:translateY(-3px)}
.ct b{display:grid;place-items:center;flex:0 0 44px;height:44px;border-radius:10px;background:var(--ac);color:var(--on);font-size:1.2rem;position:relative}
.ct b.im{background:transparent;overflow:hidden}.ct b.im img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.ct small{display:block;font-size:.68rem;letter-spacing:.12em;font-weight:600;color:var(--ac);position:relative}
.ct span{display:block;font-weight:600;font-size:1.02rem;overflow-wrap:anywhere;position:relative}
footer{margin-top:70px;border-top:1px solid var(--ln);color:#6f7a6b;text-align:center;font-size:.82rem;padding:24px 16px;background:#000}
.wa{position:fixed;bottom:18px;right:18px;width:48px;height:48px;padding:9px;border-radius:50%;background:#000;border:1px solid var(--lna);box-shadow:0 0 22px -4px var(--ac);z-index:40;transition:transform .25s}
.wa:hover{transform:scale(1.1)}.wa img{width:100%;height:100%;display:block;border-radius:50%}
@media(max-width:1000px){#trg{grid-template-columns:repeat(2,1fr)}#trg .it:nth-child(2){border-right:0}#trg .it:nth-child(-n+2){border-bottom:1px solid var(--ln)}}
@media(max-width:860px){
.mb{display:flex}.nav .navcta{display:none}
.nav ul{position:absolute;left:0;right:0;top:58px;flex-direction:column;padding:8px 20px 16px;background:rgba(5,7,5,.98);border-bottom:1px solid var(--ln);display:none}
.nav.open ul{display:flex}.nav ul a{padding:13px 4px}.nav ul a:after{left:4px;right:auto;width:28px}
header#inicio{aspect-ratio:3/2;max-height:none}
.pl{grid-template-columns:1fr;gap:18px}
.stp{grid-template-columns:1fr}.stp:before{display:none}
.promo{flex-direction:column;align-items:flex-start;padding:28px 22px}
.sec{padding-top:52px}
}
@media(max-width:620px){
.wrap{width:calc(100% - 32px)}.nav .in{width:calc(100% - 32px)}
#trg{grid-template-columns:1fr}#trg .it{border-right:0;border-bottom:1px solid var(--ln)}#trg .it:last-child{border-bottom:0}
.gbox{flex-direction:column;text-align:center;padding:26px 20px}.gbox h2{text-align:center}
.pi h3{font-size:1.6rem}.pr{font-size:2.2rem}
.ptabs{grid-template-columns:repeat(2,1fr)}
.wks{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition-duration:.01s!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}.lead h1 .ln>span{transform:none}}
</style>

 $('plw').style.display=N?'':'none';
 var sl=q('.sl'),pi=q('.pi'),tb=q('.tab'),plw=$('plw');
 function count(i){var el=pi[i]&&pi[i].querySelector('.pr');if(!el)return;var v=el.dataset.v,m=v.match(/\d+/);if(!m||matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=v;return}
  var to=+m[0],t0=performance.now();cancelAnimationFrame(el._r);(function f(t){var k=Math.min(1,(t-t0)/650),e=1-Math.pow(1-k,3);el.textContent=v.replace(m[0],Math.round(to*e));if(k<1)el._r=requestAnimationFrame(f);else el.textContent=v})(t0)}
 function show(i,user){if(!N)return;cur=(i+N)%N;sl.forEach(function(e,j){e.classList.toggle('on',j===cur)});pi.forEach(function(e,j){e.classList.toggle('on',j===cur)});tb.forEach(function(e,j){e.classList.toggle('on',j===cur)});$('pcnt').textContent='0'+(cur+1)+' / 0'+N;$('stl').textContent='webs-joel / '+st(vis[cur].name).toLowerCase().replace(/\s+/g,'-');count(cur);

  if(flash){void s.offsetWidth;s.classList.add('flash')}

 sec('faq',c.faq,function(d){$('fqt').innerHTML=rt(d.title);$('fqs').innerHTML=rt(d.subtitle);

  q('.fq button').forEach(function(bt){bt.onclick=function(){var f=bt.parentNode,o=!f.classList.contains('on');q('.fq').forEach(function(z){z.classList.remove('on');z.firstChild.setAttribute('aria-expanded',false)});if(o){f.classList.add('on');bt.setAttribute('aria-expanded',true)}}})});
