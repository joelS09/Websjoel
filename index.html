<style>
:root{--ac:#2ee6a6;--ac2:#2b8cff;--dark:#08121f}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:#fff;color:#0b0f0e;overflow-x:hidden}
a{text-decoration:none;color:inherit}
.wrap{width:min(1180px,100% - 32px);margin:auto}
.pill{display:inline-block;background:#fff;color:#0b2a4a;font-weight:700;font-size:.95rem;padding:14px 28px;border-radius:999px;transition:.25s}
.pill:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.pill.s{padding:10px 20px;font-size:.85rem}
/* NAV */
/* HERO */
.hero{position:relative;min-height:680px;display:flex;align-items:center;color:#fff;overflow:hidden;
background:repeating-radial-gradient(circle at 18% 55%,transparent 0 46px,rgba(255,255,255,.045) 47px 48px),
linear-gradient(120deg,var(--dark) 0%,color-mix(in srgb,var(--ac2) 32%,var(--dark)) 55%,color-mix(in srgb,var(--ac) 48%,var(--dark)) 100%)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:80px 0 90px}
.hero .lg{width:84px;height:84px;border-radius:20px;margin-bottom:18px;box-shadow:0 0 30px rgba(46,230,166,.25)}
.eyebrow{font-size:.78rem;letter-spacing:.18em;font-weight:700;color:var(--ac);margin-bottom:14px}
.hero h1{font-size:clamp(2rem,4.4vw,3.5rem);line-height:1.1;font-weight:800;margin-bottom:20px}
.hl{display:block;color:var(--ac2)}.hero .hl,.card .hl,.promo .hl,.lb .hl{color:var(--ac)}
.hero p{font-size:1.08rem;line-height:1.65;color:#d5e3ee;max-width:540px;margin-bottom:30px}
.hero .img{border-radius:26px;overflow:hidden;border:1px solid rgba(255,255,255,.18);box-shadow:0 30px 70px rgba(0,0,0,.45),0 0 60px color-mix(in srgb,var(--ac2) 30%,transparent)}
.hero .img img{display:block;width:100%;height:auto}
.hero .wrap{grid-template-columns:1fr;position:relative;z-index:1}.hero .wrap>div{max-width:500px}
.hero.bn{background-repeat:no-repeat;background-size:auto 100%;background-position:right center}.hero.bn.wd{background-size:cover}
.down{z-index:1;position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:1.2rem;animation:bob 2s infinite}
@keyframes bob{50%{transform:translate(-50%,6px)}}
/* INTRO + CARRUSEL */
.intro{text-align:center;padding:90px 0 20px}
.intro h2{font-size:clamp(2rem,5.2vw,3.8rem);font-weight:800;letter-spacing:-.02em}
.intro p{font-size:1.2rem;color:#444;margin:16px auto 0;max-width:720px;line-height:1.55}
.cw{position:relative}
.car{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:40px max(16px,calc((100% - 1180px)/2)) 50px}
.car::-webkit-scrollbar{display:none}
.card{position:relative;flex:0 0 min(370px,84%);height:500px;border-radius:22px;overflow:hidden;scroll-snap-align:start;color:#fff;background:#fff;box-shadow:0 14px 36px rgba(0,0,0,.14);display:flex;flex-direction:column;justify-content:flex-end;padding:26px}
.card>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .6s}
.card.ct>img{object-fit:contain;object-position:center top;height:70%}
.card:hover>img{transform:scale(1.05)}
.card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 28%,rgba(6,14,24,.93) 78%)}
.card.ct:after{background:linear-gradient(180deg,transparent 50%,rgba(6,14,24,.96) 82%)}
.card>*:not(img){position:relative;z-index:1}
.badge{position:absolute!important;top:20px;left:20px;background:var(--ac);color:#04130d;font-weight:700;font-size:.78rem;padding:6px 14px;border-radius:999px}
.card h3{font-size:1.65rem;line-height:1.15;margin-bottom:8px}
.card p{font-size:.92rem;color:#d3dde6;line-height:1.5;margin-bottom:14px}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.price{font-size:1.7rem;font-weight:800;color:var(--ac)}
.arw{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:var(--ac2);color:#fff;font-size:1.2rem;cursor:pointer;z-index:3;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.arw.l{left:max(8px,calc((100% - 1260px)/2))}.arw.r{right:max(8px,calc((100% - 1260px)/2))}
/* SALTOS DE LINEA (Enter en el panel admin) */
.card p,.card h3,.hero p,.hero h1,.intro p,.intro h2,.promo p,.promo h2,.works-s,.works h2,.wk-b p,.wk-b h4,.lb p,.lb h3{white-space:pre-line}
/* TRABAJOS */
.works{padding:70px 0 30px;text-align:center}
.works h2{font-size:clamp(1.9rem,4.6vw,3.2rem);font-weight:800;letter-spacing:-.02em}
.works-s{font-size:1.1rem;color:#444;margin:14px auto 0;max-width:680px;line-height:1.55}
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:40px;text-align:left}
.wk{border-radius:20px;overflow:hidden;cursor:zoom-in;background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.14);transition:.3s;display:flex;flex-direction:column}
.wk:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.2)}
.wk img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top;display:block;background:var(--dark)}
.wk-b{padding:16px 18px 20px}
.wk-b h4{font-size:1.15rem;font-weight:800;color:#0b0f0e;line-height:1.25}
.wk-b p{font-size:.93rem;color:#555;line-height:1.55;margin-top:6px}
.lb{position:fixed;inset:0;background:rgba(4,10,18,.93);z-index:50;display:none;align-items:center;justify-content:center;padding:24px;flex-direction:column;gap:10px;text-align:center}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:74vh;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lb h3{color:#fff;font-size:1.4rem;margin-top:6px}
.lb p{color:#d5e3ee;max-width:720px;line-height:1.55}
.lb button{position:absolute;top:16px;right:18px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:1.3rem;cursor:pointer}
/* PROMO */
.promo{background:var(--dark);color:#fff;border-radius:28px;padding:56px;margin:30px auto 80px;display:flex;align-items:center;gap:36px;background:linear-gradient(120deg,var(--dark),color-mix(in srgb,var(--ac) 30%,var(--dark)))}
.promo .lg{width:130px;height:130px;border-radius:26px;flex-shrink:0}
.promo h5{color:var(--ac);letter-spacing:.16em;font-size:.78rem;margin-bottom:10px}
.promo h2{font-size:clamp(1.6rem,3.4vw,2.5rem);font-weight:800;margin-bottom:12px}
.promo p{color:#cfe0ea;margin-bottom:24px;line-height:1.55}
footer{background:#050a10;color:#7f8e99;text-align:center;font-size:.85rem;padding:28px 16px}
.wa{position:fixed;bottom:20px;right:20px;width:48px;height:48px;padding:9px;border-radius:50%;background:#000;border:1px solid #1c3a28;box-shadow:0 2px 10px rgba(37,211,102,.3);z-index:20;transition:.25s}
.wa:hover{transform:scale(1.1)}.wa img{width:100%;height:100%;display:block;border-radius:50%}
