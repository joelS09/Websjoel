<style>
:root{--ac:#a3e635;--ac2:#7fbf1f;--dark:#050705;--bg:#050705;--pn:#0c100c;--ln:rgba(163,230,53,.22);--tx:#f4f7f2;--mu:#aab4a4}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px;-webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--tx);overflow-x:hidden;background:
radial-gradient(700px 460px at 100% 18%,color-mix(in srgb,var(--ac) 11%,transparent),transparent 70%),
radial-gradient(640px 420px at 0% 62%,color-mix(in srgb,var(--ac) 8%,transparent),transparent 70%),var(--bg)}
a{text-decoration:none;color:inherit}
.wrap{width:min(1180px,100% - 32px);margin:auto}
h1,h2,h3,h4,h5,.price{font-family:Oswald,Inter,sans-serif}
.hl{display:block;color:var(--ac)}
/* saltos de linea (Enter en el admin) */
.card p,.card h3,.intro p,.intro h2,.promo p,.promo h2,.works-s,.works h2,.wk-b p,.wk-b h4,.lb p,.lb h3{white-space:pre-line}
/* botones */
.pill{display:inline-block;background:var(--ac);color:#071004;font-weight:800;font-size:.86rem;letter-spacing:.05em;text-transform:uppercase;padding:14px 28px;border-radius:999px;transition:.25s;box-shadow:0 0 22px color-mix(in srgb,var(--ac) 30%,transparent)}
.pill:hover{transform:translateY(-2px);box-shadow:0 0 34px color-mix(in srgb,var(--ac) 55%,transparent)}
.pill.s{padding:10px 18px;font-size:.78rem}
.pill.off{opacity:.55}
/* MENU */
.nav{position:sticky;top:0;z-index:40;background:rgba(5,7,5,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.07)}
.nav .in{width:min(1180px,100% - 32px);margin:auto;height:64px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.nav .br{display:flex;align-items:center;gap:10px;font-family:Oswald,Inter,sans-serif;font-weight:700;font-size:1.25rem;letter-spacing:.06em;color:#fff;text-transform:uppercase}
.nav .lg{width:34px;height:34px;border-radius:9px;object-fit:cover}
.nav ul{list-style:none;display:flex;gap:4px;flex:1;justify-content:center}
.nav ul a{display:block;padding:9px 14px;border-radius:999px;font-weight:600;font-size:.88rem;color:#dfe6da;transition:.2s}
.nav ul a:hover{background:rgba(163,230,53,.12);color:var(--ac)}
.nav .mb{display:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--ln);background:transparent;cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.nav .mb i{display:block;width:20px;height:2px;border-radius:2px;background:#fff;transition:.25s}
.nav.open .mb i:nth-child(1){transform:translateY(7px) rotate(45deg)}
.nav.open .mb i:nth-child(2){opacity:0}
.nav.open .mb i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
/* BANNER: solo imagen rectangular, sin texto */
header#inicio.hero{display:block;position:relative;overflow:hidden;background:var(--bg);aspect-ratio:16/6;max-height:64vh;width:100%}
header#inicio.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(to bottom,transparent,var(--bg))}
#inicio #hi{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
/* SECCIONES */
.sx{padding:70px 0 10px;text-align:center}
.sx h1,.sx h2,.intro h2,.works h2,.ct-s h2{font-size:clamp(1.9rem,4.8vw,3.2rem);font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:1.05;white-space:pre-line}
.sx h2:after,.intro h2:after,.works h2:after,.ct-s h2:after{content:"";display:block;width:54px;height:4px;border-radius:4px;background:var(--ac);margin:16px auto 0;box-shadow:0 0 16px var(--ac)}
.lead h1{font-size:clamp(2.5rem,7.4vw,5.2rem)}.lead h1:after{display:none}
.lead{padding-top:58px}
.lead .cta{margin-top:26px}
.ldn{display:block;margin-top:14px;color:var(--mu);font-size:.88rem}
.works-s,.intro p,.sx .works-s{font-size:1.06rem;color:var(--mu);margin:16px auto 0;max-width:720px;line-height:1.6}
.pill.cta{padding:16px 36px;font-size:.9rem}
/* barra de confianza */
#trg{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:38px;text-align:left;background:var(--pn);border:1px solid var(--ln);border-radius:20px;overflow:hidden}
#trg .gi{display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center;background:none;box-shadow:none;border-radius:0;padding:22px 20px;border-right:1px solid var(--ln)}
#trg .gi:last-child{border-right:0}
#trg .gi:hover{transform:none;background:rgba(163,230,53,.05)}
#trg .ge{grid-row:1/3;margin:0;width:50px;height:50px;font-size:1.5rem}
#trg .gi h3{font-size:.95rem;letter-spacing:.04em;text-transform:uppercase;margin:0;align-self:end}
#trg .gi p{font-size:.84rem;align-self:start;margin-top:3px}
/* tarjetas de contenido */
.gr{display:grid;gap:16px;margin-top:36px;text-align:left}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.gi{padding:26px 24px;border-radius:20px;background:var(--pn);border:1px solid var(--ln);transition:.25s}
.gi:hover{transform:translateY(-3px);border-color:var(--ac);box-shadow:0 0 30px color-mix(in srgb,var(--ac) 16%,transparent)}
.gi .ge{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;border:1.5px solid var(--ac);font-size:1.5rem;line-height:1;margin-bottom:14px;background:rgba(163,230,53,.07)}
.gi h3{font-size:1.15rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px;color:#fff;white-space:pre-line}
.gi p{font-size:.94rem;line-height:1.6;color:var(--mu);white-space:pre-line}
.stp .ge{background:var(--ac);color:#071004;font-family:Oswald,sans-serif;font-weight:700;font-size:1.4rem;border:0;box-shadow:0 0 22px color-mix(in srgb,var(--ac) 40%,transparent)}
/* PLANES */
.intro{text-align:center;padding:80px 0 10px}
.cw{position:relative}
.car{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:40px max(16px,calc((100% - 1180px)/2)) 40px}
.car::-webkit-scrollbar{display:none}
.card{position:relative;flex:0 0 min(340px,84%);height:500px;border-radius:22px;overflow:hidden;scroll-snap-align:start;color:#fff;background:var(--pn);border:1px solid var(--ln);display:flex;flex-direction:column;justify-content:flex-end;padding:26px;transition:.3s}
.card:hover{border-color:var(--ac);box-shadow:0 0 36px color-mix(in srgb,var(--ac) 22%,transparent)}
.card>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .6s}
.card.ct>img{object-fit:contain;object-position:center top;height:70%}
.card:hover>img{transform:scale(1.05)}

radial-gradient(520px 320px at 92% 50%,color-mix(in srgb,var(--ac) 30%,transparent),transparent 70%),linear-gradient(120deg,#0a0d0a,#101a0a)}
.promo:after{content:"⚡";position:absolute;right:6%;top:50%;transform:translateY(-50%) rotate(8deg);font-size:min(14rem,34vw);line-height:1;color:var(--ac);opacity:.2;filter:drop-shadow(0 0 30px var(--ac));pointer-events:none}

/* ===== ANIMACIONES (basadas en el video) ===== */
:root{--e:cubic-bezier(.2,.7,.2,1)}
html{scroll-padding-top:92px}
/* Menú flotante tipo píldora */
.nav{top:0;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;padding:10px 0;pointer-events:none}
.nav .in{pointer-events:auto;width:min(1180px,100% - 24px);height:58px;padding:0 10px 0 18px;border-radius:999px;background:rgba(8,12,8,.72);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--ln);box-shadow:0 10px 30px rgba(0,0,0,.45);transition:box-shadow .35s,border-color .35s}
.nav.sc .in{border-color:color-mix(in srgb,var(--ac) 42%,transparent);box-shadow:0 10px 34px rgba(0,0,0,.55),0 0 26px color-mix(in srgb,var(--ac) 14%,transparent)}
.nav .ind{position:absolute;z-index:0;top:0;left:0;height:100%;border-radius:999px;background:var(--ac);box-shadow:0 0 22px color-mix(in srgb,var(--ac) 55%,transparent);opacity:0;pointer-events:none;transition:transform .38s var(--e),width .38s var(--e),opacity .25s}
.nav ul a{position:relative;z-index:1}
.nav ul a:hover{background:none}
.nav ul a.on{color:#071004}
@media(min-width:861px){.nav ul{position:relative}}
@media(max-width:860px){
.nav .ind{display:none}
.nav ul a.on{background:var(--ac)}
.nav ul{top:76px;left:12px;right:12px;border:1px solid var(--ln);border-radius:22px;pointer-events:auto}
}
/* Entrada del banner */
html.rvon #hi:not(.ld){opacity:0}
#hi.ld{animation:heroIn 1.5s var(--e) both}
@keyframes heroIn{from{opacity:0;transform:scale(1.14);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
/* Aparición escalonada con desenfoque (al hacer scroll) */
html.rvon .rv:not(.in){opacity:0;filter:blur(10px);transform:translateY(22px) scale(.975);transition:none!important}
html.rvon .rv.in{animation:rvIn .8s var(--e) var(--d,0ms) both}
@keyframes rvIn{from{opacity:0;filter:blur(10px);transform:translateY(22px) scale(.975)}to{opacity:1;filter:blur(0);transform:none}}
/* Línea bajo los títulos: crece al aparecer */
.hd:after{transition:transform .9s var(--e) .25s}
html.rvon .hd:not(.hd-in):after{transform:scaleX(0)}
.gbox h2:after{transform-origin:left center}
/* Botones: barrido blanco al pasar el mouse */
.pill{position:relative;overflow:hidden;isolation:isolate}
.pill:before{content:"";position:absolute;inset:0;z-index:-1;background:#fff;transform:scaleX(0);transform-origin:left center;transition:transform .4s var(--e)}
.pill:hover:before{transform:scaleX(1)}
.pill.cta:after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;z-index:-1;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 4.8s ease-in-out 1.8s infinite}
@keyframes shine{0%{left:-60%}32%,100%{left:140%}}
/* Tarjetas: brillo que sigue al mouse */
.gi,.card,.wk,.ct-i{position:relative}
.gi:before,.card:before,.wk:before,.ct-i:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;opacity:0;transition:opacity .35s;background:radial-gradient(280px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--ac) 15%,transparent),transparent 62%)}
.gi:hover:before,.card:hover:before,.wk:hover:before,.ct-i:hover:before{opacity:1}
.gi .ge{transition:transform .35s var(--e),box-shadow .35s}
.gi:hover .ge{transform:scale(1.1) rotate(-4deg);box-shadow:0 0 22px color-mix(in srgb,var(--ac) 45%,transparent)}
.arw{transition:transform .2s}
.arw:hover{transform:translateY(-50%) scale(1.12)}
/* Botón de WhatsApp: onda pulsante */
.wa:after{content:"";position:absolute;inset:-1px;border-radius:50%;border:2px solid var(--ac);pointer-events:none;animation:ring 3.2s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
/* Respuestas a acciones: elegir plan, abrir pregunta, abrir imagen */
.card.on{animation:pick .55s var(--e)}
@keyframes pick{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 60%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
.faq details[open] p{animation:faqIn .4s var(--e)}
@keyframes faqIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.lb.on{animation:fadeIn .25s ease}
.lb.on img{animation:zoomIn .4s var(--e)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes zoomIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
/* Sin movimiento si la persona lo prefiere */
@media(prefers-reduced-motion:reduce){
html.rvon .rv:not(.in){opacity:1;filter:none;transform:none}
html.rvon .rv.in,#hi.ld,.wa:after,.pill.cta:after,.card.on,.lb.on,.lb.on img,.faq details[open] p{animation:none!important}
html.rvon .hd:after{transform:none!important;transition:none}
.nav .ind{transition:none}
}

/* ===== CARRUSEL ANIMADO (basado en el video del smartwatch) ===== */
@property --glow{syntax:'<color>';inherits:true;initial-value:rgba(0,0,0,0)}
/* Resplandor de fondo que toma el color de la tarjeta activa */
.cw{isolation:isolate;transition:--glow 1s ease}
.cw:before{content:"";position:absolute;inset:-30px 0;z-index:-1;pointer-events:none;background:radial-gradient(55% 65% at 50% 55%,var(--glow),transparent 72%)}
/* Profundidad: la tarjeta activa destaca y las vecinas se alejan un poco */
.car .card,.car .wk{opacity:calc(1 - var(--a,0)*.22);scale:calc(1 - var(--a,0)*.04)}
.car .card:hover,.car .wk:hover{opacity:1}
.car .card{transition:border-color .3s,box-shadow .3s}
.car .wk{transition:transform .3s,border-color .3s,box-shadow .3s}
.car .card.fx,.car .wk.fx{border-color:color-mix(in srgb,var(--ac) 70%,transparent);box-shadow:0 0 34px color-mix(in srgb,var(--ac) 20%,transparent)}
/* Paralaje: mientras el carrusel se mueve, textos e imagen se deslizan a distinta velocidad; al detenerse vuelven a su sitio */
.car .card>img{translate:calc(var(--vn,0)*-26px) 0}
.car .card>.badge{translate:calc(var(--vn,0)*18px) 0}
.car .card>h3{translate:calc(var(--vn,0)*28px) 0}
.car .card>p{translate:calc(var(--vn,0)*38px) 0}
.car .card>.row{translate:calc(var(--vn,0)*48px) 0}
.car .wk-b{translate:calc(var(--vn,0)*32px) 0}
/* Fila de miniaturas (reemplaza los puntos) */
.dots.th{display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 16px 20px}
.dots.th button.th{flex:none;width:48px;height:48px;border-radius:50%;padding:0;background-color:var(--pn);background-size:cover;background-position:center top;border:2px solid rgba(255,255,255,.14);opacity:.5;scale:.88;transition:opacity .35s,scale .45s var(--e),border-color .35s,box-shadow .35s}
.dots.th button.th:hover{opacity:.85}
.dots.th button.th.on{width:48px;border-radius:50%;opacity:1;scale:1.2;border-color:var(--ac);box-shadow:0 0 18px color-mix(in srgb,var(--ac) 55%,transparent)}
@media(prefers-reduced-motion:reduce){
.car .card,.car .wk{scale:none}
.car .card>*,.car .wk-b{translate:none!important}
.cw{transition:none}
}
